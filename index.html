<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
    <h1 style="text-align: center;">Ler Livro EPUB</h1>
    <div id="bottons"></div>
    <div id="livro"></div>
    <button type="button" id="prev">&lt;</button>
    <button type="button" id="next">&gt;</button>

    <script type="module">

        class Dado{
            constructor(valor) {this.valor = valor}
        }

        const enviar = (dad) => fetch("http://127.0.0.1:8000/recebe/", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(dad)
        });

        enviar(new Dado(122));
        async function ixe() { // retorna lista de livros 
            const resposta = await fetch("http://localhost:8000/envia/");
            const dados = await resposta.json();

            return  dados;
        }
        const a = await ixe();
        console.log(a)

        let ebook = ePub();
        let redention = null

        async function book(urlLivro){ //Função para receber url do livro e abrilo

            if(redention){
                redention.destroy();
            }
            await ebook.open(urlLivro);
            redention = ebook.renderTo("livro", {width: "600px",
            height:"800px",
            allowScriptedContent: true});
            await redention.display();
        }

        var prev = document.getElementById("prev"); // Função para passar a pagina do livro
        prev.addEventListener("click", function(){
            redention.prev();
        })

        var next = document.getElementById("next"); // Função para voltar a pagina do livro
        next.addEventListener("click", function(){
            redention.next();
        })

        async function obterLivros() { // retorna lista de livros 
            const resposta = await fetch("http://localhost:8000/api/books");
            const dados = await resposta.json();

            return  dados;
        }

        //await para esperar o retorno da lista. precisa do type module para funcionar
        const lista = await obterLivros();  

        // para cada item da lista criar um botão com o nome do livro e abir o livro do botão
        lista.forEach(element => {
            const butao = document.createElement("button"); //define o elemento que vai ser criado
            butao.textContent = element.replace(".epub", "") //da o nome para o botão de acordo com a lista
            document.getElementById("bottons").append(butao); // adiciona botão dentro da div
            butao.addEventListener("click", () =>{
                book(`http://127.0.0.1:8000/api/books/${element}`)
            })
        });

    </script>
   
</body>
</html>
